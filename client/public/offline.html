<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1015" />
    <title>Offline · auf gehts</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1015;
        --text: #e7e8ee;
        --muted: #8a8d9a;
        --accent: #82b4ff;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 80px 20px;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      button {
        background: var(--accent);
        color: #0f1015;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>This page hasn't been cached yet. Reconnect to load it, or open a page you've visited recently.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
